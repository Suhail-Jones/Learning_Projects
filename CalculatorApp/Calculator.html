<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <link rel="stylesheet" href="Styles.css">
    <div class="buttons" id="add">+</div>
    <div class="buttons" id="subtract">−</div>
    <div class="buttons" id="multiply">×</div>
    <div class="buttons" id="divide">÷</div>
    <div class="buttons" id="compute">=</div>
    <div id="result">0</div>
    <div id="outerBox"></div>

    <table id="table">
        <tr>
            <th class="numbers">1</th>
            <th class="numbers">2</th>
            <th class="numbers">3</th>
        </tr>
        <tr>
            <th class="numbers">4</th>
            <th class="numbers">5</th>
            <th class="numbers">6</th>
        </tr>
        <tr>
            <th class="numbers">7</th>
            <th class="numbers">8</th>
            <th class="numbers">9</th>
        </tr>
        <tr>
            <th></th>
            <th class="numbers">0</th>
            <th></th>
        </tr>
    </table>

</body>
</html>
